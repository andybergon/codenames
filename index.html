<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codenames Trainer</title>
    <script>
      (() => {
        const storageKey = "codenames-theme";
        let setting = "system";
        try {
          const stored = window.localStorage.getItem(storageKey);
          if (["system", "light", "dark"].includes(stored)) setting = stored;
        } catch {}
        const resolved =
          setting === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : setting;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeSetting = setting;
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>Codenames Clue Trainer</h1>
        <div class="theme-switcher" role="group" aria-label="Color theme">
          <button
            type="button"
            data-theme-value="system"
            aria-label="Use system theme"
            aria-pressed="true"
            title="System theme"
          >
            <i data-lucide="monitor" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            data-theme-value="light"
            aria-label="Use light theme"
            aria-pressed="false"
            title="Light theme"
          >
            <i data-lucide="sun" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            data-theme-value="dark"
            aria-label="Use dark theme"
            aria-pressed="false"
            title="Dark theme"
          >
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <section class="workspace">
        <div class="board-panel" aria-label="Codenames board editor">
          <div class="panel-header">
            <div>
              <div class="board-title-row">
                <h2>Board</h2>
                <button
                  class="disclosure-button"
                  id="toggle-board"
                  type="button"
                  aria-label="Collapse board"
                  aria-controls="board-grid"
                  aria-expanded="true"
                  title="Collapse board"
                >
                  <span class="chevron" aria-hidden="true"></span>
                </button>
              </div>
              <p id="board-counts" class="muted"></p>
              <div id="board-metrics" class="board-metrics" aria-label="Board difficulty metrics"></div>
            </div>
            <div class="board-header-actions">
              <div class="board-source-actions" role="group" aria-label="Board source">
                <button
                  class="button board-action"
                  id="random-board"
                  type="button"
                  title="Generate 25 new words and assign new roles"
                >
                  New
                </button>
                <button
                  class="button secondary board-action"
                  id="load-sample"
                  type="button"
                  title="Restore the fixed training board"
                >
                  Sample
                </button>
              </div>
              <div class="word-set-control">
                <span class="word-set-label">New board words</span>
                <div class="word-set-switch" role="group" aria-label="Board word set">
                  <button
                    type="button"
                    data-word-set-value="official"
                    aria-pressed="true"
                    title="Use the 400 words from the original English base game"
                  >
                    Official <span>400</span>
                  </button>
                  <button
                    type="button"
                    data-word-set-value="extended"
                    aria-pressed="false"
                    title="Use the official words plus trainer additions"
                  >
                    Extended <span>407</span>
                  </button>
                </div>
              </div>
              <div class="order-switch" role="group" aria-label="Card layout">
                <button
                  id="order-grouped"
                  type="button"
                  aria-label="Show cards sorted by role"
                  aria-pressed="true"
                  title="Group cards by Friendly, Enemy, Neutral, and Assassin"
                >
                  Sorted
                </button>
                <button
                  id="order-random"
                  type="button"
                  aria-label="Show the board's random card order"
                  aria-pressed="false"
                  title="Show this board's preserved random arrangement"
                >
                  Random
                </button>
              </div>
              <button
                class="icon-button"
                id="share-board"
                type="button"
                aria-label="Copy board share link"
                title="Copy board share link"
              >
                <i data-lucide="share-2" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div id="board-grid" class="board-grid"></div>
        </div>

        <aside class="results-panel" aria-label="Clue recommendations">
          <div class="panel-header recommendation-header">
            <div>
              <h2>Recommendations</h2>
              <p id="analysis-status" class="muted"></p>
            </div>
            <div class="recommendation-toolbar">
              <div class="target-range-filter">
                <div class="range-filter-heading">
                  <span class="range-filter-label">Target words</span>
                  <output id="target-range-value" for="target-min target-max">2-4</output>
                </div>
                <div id="target-range-control" class="dual-range">
                  <span class="range-track" aria-hidden="true">
                    <span class="range-selection"></span>
                  </span>
                  <input
                    id="target-min"
                    type="range"
                    min="1"
                    max="9"
                    value="2"
                    aria-label="Minimum target words"
                  />
                  <input
                    id="target-max"
                    type="range"
                    min="1"
                    max="9"
                    value="4"
                    aria-label="Maximum target words"
                  />
                </div>
                <div
                  id="target-count-breakdown"
                  class="target-count-breakdown"
                  aria-label="Recommendations by target count"
                ></div>
              </div>
              <div
                class="worth-filter"
                title="Minimum composite Worth score"
              >
                <div class="range-filter-heading">
                  <label for="minimum-worth">Min worth</label>
                  <output id="minimum-worth-value" for="minimum-worth">50</output>
                </div>
                <div
                  id="worth-distribution"
                  class="worth-distribution"
                  role="img"
                  aria-label="Worth distribution"
                ></div>
                <input
                  id="minimum-worth"
                  type="range"
                  min="0"
                  max="99"
                  value="50"
                  aria-label="Minimum Worth score"
                />
                <div class="worth-limits" aria-hidden="true">
                  <span>0</span>
                  <span>99</span>
                </div>
              </div>
              <span id="recommendation-count" class="pill" aria-label="Recommendation count"></span>
            </div>
          </div>
          <div id="recommendation-results" class="suggestions"></div>
        </aside>
      </section>

      <section class="model-strip" aria-label="Model summary">
        <div>
          <span class="metric-label">Embedding model</span>
          <strong id="model-name">MiniLM-L6-v2</strong>
        </div>
        <div>
          <span class="metric-label">Clue vocabulary</span>
          <strong id="vocabulary-source">wordfreq + seeds</strong>
        </div>
        <div>
          <span class="metric-label">Friendly words</span>
          <strong id="friendly-total">0</strong>
        </div>
        <div>
          <span class="metric-label">Clue candidates</span>
          <strong id="candidate-total">0</strong>
        </div>
        <div>
          <span class="metric-label">Best margin</span>
          <strong id="best-margin">0.00</strong>
        </div>
        <div>
          <span class="metric-label">Best net</span>
          <strong id="best-net">0.0</strong>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
